name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装依赖
        run: pip install -e ".[dev]"
      - name: 单元测试
        run: pytest -q
      - name: 评测回归（mock 模式，不需要 API key；规则判错一条就失败）
        run: python evals/run_eval.py --no-llm --min-rule-precision 1.0
      - name: 端到端：分析示例日志并生成报告
        run: python -m analyzer.cli data/logs/sample.csv --no-llm --report reports/report.md
      - uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            reports/report.md
            evals/results.md
